name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Analisi SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installa PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Installa Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Installa SonarScanner
        run: |
          curl --proto '=https' --proto-redir '=https' -fSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -t /tmp/sonar-scanner.zip
          unzip -q /tmp/sonar-scanner.zip -d /tmp/sonar-scanner
          sed -i 's/^use_embedded_jre=true$/use_embedded_jre=false/' /tmp/sonar-scanner/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner
          echo "/tmp/sonar-scanner/sonar-scanner-5.0.1.3006-linux/bin" >> "$GITHUB_PATH"

      - name: Installa dipendenze
        run: composer install --no-interaction --prefer-dist

      - name: Test unitari con copertura
        run: vendor/bin/phpunit --coverage-clover=tests/runtime/coverage.xml

      - name: Test JavaScript con copertura
        run: node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=tests/runtime/js-coverage.lcov tests/js-behavior.test.cjs

      - name: Analisi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=LightYagami28_AlphanoGdr \
            -Dsonar.organization=lightyagami28 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.sources=. \
            -Dsonar.tests=tests \
            -Dsonar.exclusions=vendor/**,tests/** \
            -Dsonar.coverage.exclusions=vendor/** \
            -Dsonar.php.coverage.reportPaths=tests/runtime/coverage.xml \
            -Dsonar.javascript.lcov.reportPaths=tests/runtime/js-coverage.lcov
